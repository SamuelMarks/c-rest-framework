repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        args: ['-style=LLVM']
        types_or: [c, c++]
  - repo: local
    hooks:
      - id: cppcheck
        name: Cppcheck
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" cppcheck
        language: python
        pass_filenames: false
        types_or: [c, c++]
      - id: build-gcc
        name: Build (GCC)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" build gcc
        language: python
        pass_filenames: false
      - id: test-gcc
        name: Test (GCC)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" test gcc
        language: python
        pass_filenames: false
      - id: build-clang
        name: Build (Clang)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" build clang
        language: python
        pass_filenames: false
      - id: test-clang
        name: Test (Clang)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" test clang
        language: python
        pass_filenames: false
      - id: build-msvc-wine
        name: Build & Test (MSVC Wine)
        entry: python -c "import os, subprocess, shutil, sys; (print('Skipping MSVC Wine'), sys.exit(0)) if os.name == 'nt' or not shutil.which('wine') or not os.path.isdir(os.environ.get('MSVC_WINE_PATH', os.path.expanduser('~/my_msvc/opt/msvc'))) else None; [os.environ.pop(k, None) for k in ('GIT_INDEX_FILE', 'GIT_DIR', 'GIT_WORK_TREE')]; os.environ['CTEST_PARALLEL_LEVEL'] = '4'; os.environ['_NO_DEBUG_HEAP'] = '1'; r = subprocess.run(['bash', '-c', 'bash ~/repos/c-ci/build_msvc_wine.sh -DCMAKE_DISABLE_FIND_PACKAGE_SQLite3=ON -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=ON -DCMAKE_DISABLE_FIND_PACKAGE_Brotli=ON -DCMAKE_DISABLE_FIND_PACKAGE_CURL=ON > wine_hook.log 2>&1; R=$?; cat wine_hook.log; rm -f wine_hook.log; wineserver -k9 || true; exit $R']); sys.exit(r.returncode)"
        language: python
        pass_filenames: false
      - id: build-msvc
        name: Build (MSVC)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" build msvc
        language: python
        pass_filenames: false
      - id: test-msvc
        name: Test (MSVC)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" test msvc
        language: python
        pass_filenames: false
      - id: build-mingw
        name: Build (MinGW)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" build mingw
        language: python
        pass_filenames: false
      - id: test-mingw
        name: Test (MinGW)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" test mingw
        language: python
        pass_filenames: false
      - id: valgrind
        name: Valgrind (GCC)
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" valgrind gcc
        language: python
        pass_filenames: false
      - id: update-shields
        name: Update README Shields
        entry: python -c "import urllib.request; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/master/precommit_matrix.py').read())" shields
        language: python
        additional_dependencies: [gcovr]
        pass_filenames: false
      - id: build-cdb
        name: Build Compilation Database
        entry: python -c "import os, subprocess, sys; [os.environ.pop(k, None) for k in ('GIT_INDEX_FILE', 'GIT_DIR', 'GIT_WORK_TREE')]; r = subprocess.run(['cmake', '-S', '.', '-B', 'build_cdb', '-DCMAKE_EXPORT_COMPILE_COMMANDS=ON']); sys.exit(r.returncode)"
        language: python
        pass_filenames: false
      - id: check-signatures
        name: Check Function Signatures
        entry: python scripts/check_signatures.py
        language: python
        pass_filenames: false
      - id: check-enum-returns
        name: Check Enum Returns
        entry: python scripts/check_enum_returns_clang.py -p build_cdb src include examples
        language: python
        additional_dependencies: [libclang]
        pass_filenames: false
      - id: check-no-discard-void
        name: Check No-Discard Void Casts
        entry: python -c "import clang.cindex, glob, os, sys, urllib.request; lib = next((p for pat in ['/opt/homebrew/Cellar/llvm*/*/lib/libclang.dylib', '/opt/homebrew/lib/libclang.dylib', '/Library/Developer/CommandLineTools/usr/lib/libclang.dylib', '/usr/lib/libclang.so*', '/usr/lib/llvm-*/lib/libclang.so*'] for p in glob.glob(pat)), None); clang.cindex.Config.set_library_file(lib) if lib else None; bdir = 'build_cdb' if os.path.exists('build_cdb/compile_commands.json') else ('build' if os.path.exists('build/compile_commands.json') else None); sys.argv[1:1] = ['--build-dir', bdir] if bdir and '--build-dir' not in sys.argv else []; sys.argv.extend(['src', 'include', 'examples', 'tests']) if not [a for a in sys.argv[1:] if not a.startswith('-')] else None; exec(urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/refs/heads/master/precommit_hooks/check_no_discard_void_clang.py').read())"
        language: python
        additional_dependencies: [libclang]
        types_or: [c]
      - id: check-error-percolation
        name: Check Error Percolation
        entry: python -c "import glob, os, subprocess, sys, urllib.request; lib = next((p for pat in ['/Library/Developer/CommandLineTools/usr/lib/libclang.dylib', '/opt/homebrew/lib/libclang.dylib', '/usr/lib/libclang.so*', '/usr/lib/llvm-*/lib/libclang.so*'] for p in glob.glob(pat)), None); code = urllib.request.urlopen('https://raw.githubusercontent.com/SamuelMarks/c-ci/refs/heads/master/precommit_hooks/check_error_percolation_clang.py').read().decode('utf-8'); defs = ['-DC_REST_FRAMEWORK_USE_CDD_C', '-DC_REST_FRAMEWORK_USE_REAL_CAH', '-DC_REST_FRAMEWORK_USE_REAL_C_ORM', '-DC_REST_FRAMEWORK_ENABLE_RESPONSE_COMPRESSION_GZIP_BROTLI', '-DC_REST_ENABLE_RATE_LIMITING_THROTTLING_MIDDLEWARE', '-DC_REST_ENABLE_JWT_JSON_WEB_TOKENS_AUTHENTICATION_MIDDLEWARE', '-DC_REST_ENABLE_FULL_MULTIPART_FORM_STREAMING', '-DC_REST_ENABLE_SERVER_SENT_EVENTS_SSE', '-DC_REST_FRAMEWORK_ENABLE_GRAPHQL', '-DC_REST_FRAMEWORK_ENABLE_SERVER_SIDE_TEMPLATE_ENGINE_HTML_RENDERING', '-DC_REST_ENABLE_HOT_RELOADING_AUTO_RESTART']; sys.argv = ['check_error_percolation_clang.py'] + (['--libclang-path', lib] if lib else []) + ['src', 'examples'] + ['--compile-args', '-Ibuild_cdb/crf_parson_inc', '-Iinclude', '-Ibuild_cdb'] + [f'-I{d}' for d in glob.glob('build_cdb/_deps/*-src/include') + glob.glob('build_cdb/_deps/*-src') + glob.glob('build_cdb/_deps/*-build/*') + glob.glob('build_cdb/_deps/*-build')] + defs; exec(compile(code, 'check_error_percolation_clang.py', 'exec'))"
        language: python
        additional_dependencies: [libclang]
        pass_filenames: false
